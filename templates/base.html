<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Votações do condomínio{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <div class="wrap">
    <a class="marca" href="{{ url_for('index') }}">Votações do condomínio</a>
    <nav>
      {% if g.user %}
        {% if g.user.perfil == 'admin' %}
          <a href="{{ url_for('nova_votacao') }}">Nova votação</a>
          <a href="{{ url_for('admin') }}">Cadastros</a>
        {% endif %}
        <a href="{{ url_for('logout') }}">Sair ({{ g.user.nome.split()[0] }})</a>
      {% endif %}
    </nav>
  </div>
</header>
<main class="wrap">
  {% for m in get_flashed_messages() %}<div class="aviso" role="status">{{ m }}</div>{% endfor %}
  {% block conteudo %}{% endblock %}
</main>
</body>
</html>
